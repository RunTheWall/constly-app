<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Constly release notes</title>
    <meta name="description" content="Release notes for Constly, a WYSIWYG markdown editor for macOS, Windows, and Linux." />
    <style>
      :root {
        --bg: #faf9f7; --fg: #1f1f1d; --muted: #76746e; --border: #e6e4df;
        --accent: #4666d1; --card: #fff;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font-family: var(--sans); line-height: 1.6;
        padding: 40px 20px 80px;
      }
      .wrap { max-width: 720px; margin: 0 auto; }
      header { margin-bottom: 8px; }
      .brand { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
      .brand a { color: inherit; text-decoration: none; }
      h1 { font-size: 30px; letter-spacing: -0.025em; margin: 6px 0 4px; }
      .sub { color: var(--muted); margin: 0 0 8px; }
      .sub a { color: var(--accent); }
      hr.top { height: 1px; background: var(--border); border: 0; margin: 22px 0 8px; }
      #log h2 {
        font-size: 20px; letter-spacing: -0.02em; margin: 40px 0 4px;
        padding-top: 18px; border-top: 1px solid var(--border);
      }
      #log h2:first-of-type { border-top: 0; padding-top: 0; margin-top: 18px; }
      #log h3 { font-size: 15px; margin: 22px 0 6px; }
      #log ul { margin: 8px 0 0; padding-left: 22px; }
      #log li { margin: 7px 0; }
      #log p { margin: 10px 0; }
      #log strong { font-weight: 600; }
      #log code {
        font-family: var(--mono); font-size: 0.88em; background: #f1efea;
        border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
      }
      #log a { color: var(--accent); }
      .note { color: var(--muted); font-size: 13px; margin-top: 40px; }
      .note a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand"><a href="https://constly.com">Constly</a></div>
        <h1>Release notes</h1>
        <p class="sub">
          A WYSIWYG markdown editor that renders the marks away as you type.
          <a href="https://constly.com/download">Download</a> &middot;
          <a href="https://github.com/RunTheWall/constly-app/issues">Issues</a> &middot;
          <a href="https://github.com/RunTheWall/constly-app/blob/main/ROADMAP.md">Roadmap</a>
        </p>
        <hr class="top" />
      </header>

      <main id="log">Loading&hellip;</main>

      <p class="note">
        Source of truth:
        <a href="https://github.com/RunTheWall/constly-app/blob/main/CHANGELOG.md">CHANGELOG.md</a>.
        Downloads are on <a href="https://constly.com/download">constly.com</a>.
      </p>
    </div>

    <script>
      // Render the repo's CHANGELOG.md so this page never drifts from it.
      // raw.githubusercontent serves Access-Control-Allow-Origin: *, so the
      // cross-origin fetch is allowed. Small renderer for the exact subset the
      // changelog uses: ## / ###, "- " bullets (with wrapped continuation),
      // **bold**, *italic*, `code`, [text](url), blank-line breaks.
      const RAW =
        "https://raw.githubusercontent.com/RunTheWall/constly-app/main/CHANGELOG.md";

      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function inline(s) {
        // Order: code first (so its contents are not further formatted),
        // then links, then bold, then italic. Input is already HTML-escaped.
        s = s.replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>");
        s = s.replace(
          /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
          (_, t, u) => '<a href="' + u + '" rel="noopener">' + t + "</a>",
        );
        s = s.replace(/\*\*([^*]+)\*\*/g, (_, b) => "<strong>" + b + "</strong>");
        s = s.replace(/\*([^*]+)\*/g, (_, i) => "<em>" + i + "</em>");
        return s;
      }
      function render(md) {
        const lines = md.replace(/\r\n?/g, "\n").split("\n");
        const out = [];
        let mode = null; // null | "ul" | "p"
        let buf = []; // current list item or paragraph text pieces
        function flushItem() {
          if (mode === "ul" && buf.length) {
            out.push("<li>" + inline(buf.join(" ")) + "</li>");
          } else if (mode === "p" && buf.length) {
            out.push("<p>" + inline(buf.join(" ")) + "</p>");
          }
          buf = [];
        }
        function close() {
          flushItem();
          if (mode === "ul") out.push("</ul>");
          mode = null;
        }
        for (const raw of lines) {
          const line = raw.replace(/\s+$/, "");
          const t = esc(line.trim());
          if (line.trim() === "") {
            close();
            continue;
          }
          let m;
          if ((m = /^#{2}\s+(.*)$/.exec(line.trim()))) {
            close();
            out.push("<h2>" + inline(esc(m[1])) + "</h2>");
          } else if ((m = /^#{3,}\s+(.*)$/.exec(line.trim()))) {
            close();
            out.push("<h3>" + inline(esc(m[1])) + "</h3>");
          } else if ((m = /^[-*]\s+(.*)$/.exec(line.trim()))) {
            flushItem();
            if (mode !== "ul") {
              close();
              out.push("<ul>");
              mode = "ul";
            }
            buf = [esc(m[1])];
          } else {
            // continuation of the current item/paragraph, or a new paragraph
            if (mode === "ul" || mode === "p") {
              buf.push(t);
            } else {
              mode = "p";
              buf = [t];
            }
          }
        }
        close();
        return out.join("\n");
      }

      fetch(RAW, { cache: "no-store" })
        .then((r) => {
          if (!r.ok) throw new Error("fetch failed");
          return r.text();
        })
        .then((md) => {
          // Drop the leading "# Changelog" H1; the page already has a title.
          const body = md.replace(/^#\s+Changelog\s*\n/i, "");
          document.getElementById("log").innerHTML = render(body);
        })
        .catch(() => {
          document.getElementById("log").innerHTML =
            '<p>Could not load the release notes. Read them on ' +
            '<a href="https://github.com/RunTheWall/constly-app/blob/main/CHANGELOG.md">GitHub</a>.</p>';
        });
    </script>
  </body>
</html>
